<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Color Palette Generator</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Color Palette Generator</h1>
            <button id="generator-btn">
                <i class="fas fa-sync-alt"></i>
                Generate Palette
            </button>

            <div class="palette-container">
                <!-- Color Box 1 -->
                <div class="color-box">
                    <div class="color" style="background-color: #f63049"></div>
                    <div class="color-info">
                        <span class="hex-value">#F63049</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to Clipboard"
                        ></i>
                    </div>
                </div>

                <!-- Color Box 2 -->
                <div class="color-box">
                    <div class="color" style="background-color: #d02752"></div>
                    <div class="color-info">
                        <span class="hex-value">#D02752</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to Clipboard"
                        ></i>
                    </div>
                </div>

                <!-- Color Box 3 -->
                <div class="color-box">
                    <div class="color" style="background-color: #002fff"></div>
                    <div class="color-info">
                        <span class="hex-value">#002fff</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to Clipboard"
                        ></i>
                    </div>
                </div>

                <!-- Color Box 4 -->
                <div class="color-box">
                    <div class="color" style="background-color: #0cfdf1"></div>
                    <div class="color-info">
                        <span class="hex-value">#0cfdf1</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to Clipboard"
                        ></i>
                    </div>
                </div>

                <!-- Color Box 5 -->
                <div class="color-box">
                    <div class="color" style="background-color: #22ff0e"></div>
                    <div class="color-info">
                        <span class="hex-value">#22ff0e</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to Clipboard"
                        ></i>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
